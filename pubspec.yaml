name: pdf_pro
description: A premium Flutter application for professional PDF tools.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  file_picker: ^8.1.7
  printing: ^5.12.0
  pdf: ^3.11.1
  share_plus: ^10.0.2
  permission_handler: ^11.3.0
  path_provider: ^2.10.0
  url_launcher: ^6.1.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
